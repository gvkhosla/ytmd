<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="{{BASE}}">
<title>ytmd social card source</title>
<style>
@font-face { font-family: Barlow; src: url('assets/BarlowSemiCondensed-SemiBold.ttf'); font-weight: 600; }
@font-face { font-family: Inter; src: url('assets/InterVariable.woff2'); font-weight: 100 900; }
* { box-sizing: border-box; }
body { margin: 0; width: 1200px; height: 630px; padding: 48px; background: #fafafa; color: #111; font: 18px/1.6 Inter, sans-serif; }
header, footer { display: flex; align-items: center; justify-content: space-between; }
header { color: #3f3f46; font-size: 15px; }
header img { width: 94px; height: 29px; }
main { display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center; margin-top: 74px; }
h1 { font: 600 76px/1 Barlow, sans-serif; letter-spacing: -.03em; margin: 0; max-width: 16ch; }
p { margin: 0; }
.intro p { color: #111; font-size: 22px; margin-top: 24px; max-width: 28ch; }
.videos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.videos img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; border-radius: 8px; }
footer { margin-top: 82px; font-size: 15px; color: #3f3f46; }
</style>
</head>
<body>
<header><img src="assets/wordmark.svg" alt="ytmd"><p>Pi · Codex · Claude Code</p></header>
<main><div class="intro"><h1>Put YouTube videos<br>to work</h1><p>Give your agent a video and a task. Get a plan with timestamps.</p></div><div class="videos"><img src="assets/videos/D7_ipDqhtwk.jpg" alt="Barry Zhang"><img src="assets/videos/wsFd22SL1s8.jpg" alt="Arrakis sandbox talk"><img src="assets/videos/6_BcCthVvb8.jpg" alt="LangChain and Manus"><img src="assets/videos/WU-lBOAS1VQ.jpg" alt="Patrick Collison on Dwarkesh"><img src="assets/videos/MZ14rrkHVbg.jpg" alt="Miles Grimshaw on Dialectic"><img src="assets/videos/eURcW5_uS60.jpg" alt="Brian Chesky on Invest Like the Best"></div></main>
<footer><p>Local Markdown + SQLite FTS5</p><p>gvkhosla.github.io/ytmd</p></footer>
</body>
</html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmd"
version = "0.7.0"
description = "Use YouTube videos with your agent: local captions, chapter reads, and timestamped evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Geet Khosla" }]
keywords = ["youtube", "transcript", "captions", "cli", "agents"]
urls = { Homepage = "https://gvkhosla.github.io/ytmd/", Repository = "https://github.com/gvkhosla/ytmd" }

[tool.setuptools]
script-files = ["ytmd"]
